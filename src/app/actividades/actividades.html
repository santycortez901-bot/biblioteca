<body>
  <div class="actividad-container">

  <h1>Actividades</h1>


  <!-- Barra de Filtros y Búsqueda -->

  <div class="toolbar-card">


    <!-- BUSCADOR -->

    <div class="search-box">

      <input
        type="text"
        placeholder="Historial"
        [(ngModel)]="textoBusqueda"
        (input)="buscar()"
      />

    </div>


    <div class="date-filter-group">


      <!-- FECHA -->

      <div class="date-input-wrapper">

        <label for="fecha-desde">
          Fecha
        </label>

        <input
          type="date"
          id="fecha-desde"
          class="date-input"
          [(ngModel)]="fechaSeleccionada"
          (change)="filtrarPorFecha()"
        />

      </div>


      <!-- FILTROS -->

      <div class="filters">


        <!-- TODOS -->

        <button
          class="filter-btn"
          [class.active]="esFiltroActivo('todos')"
          (click)="filtrarPorTipo('todos')"
        >
          Todos
        </button>


        <!-- PRÉSTAMOS -->

        <button
          class="filter-btn"
          [class.active]="esFiltroActivo('prestamo')"
          (click)="filtrarPorTipo('prestamo')"
        >
          Préstamos
        </button>


        <!-- CUOTAS -->

        <button
          class="filter-btn"
          [class.active]="esFiltroActivo('cuota')"
          (click)="filtrarPorTipo('cuota')"
        >
          Cuotas
        </button>


        <!-- SOCIOS -->

        <button
          class="filter-btn"
          [class.active]="esFiltroActivo('socio')"
          (click)="filtrarPorTipo('socio')"
        >
          Socios
        </button>


        <!-- LIBROS -->

        <button
          class="filter-btn"
          [class.active]="esFiltroActivo('libro')"
          (click)="filtrarPorTipo('libro')"
        >
          Libros
        </button>


        <!-- ELIMINACIONES -->

        <button
          class="filter-btn"
          [class.active]="esFiltroActivo('eliminacion')"
          (click)="filtrarPorTipo('eliminacion')"
        >
          Eliminaciones
        </button>


        <!-- EDICIONES -->

        <button
          class="filter-btn"
          [class.active]="esFiltroActivo('edicion')"
          (click)="filtrarPorTipo('edicion')"
        >
          Ediciones
        </button>

      </div>


      <!-- CANTIDAD DE REGISTROS -->

      <div class="selector-container">

        <span class="records-count">

          {{ actividadesFiltradas.length }} registro(s)

        </span>

      </div>

    </div>


  </div>


  <!-- Tabla de Resultados -->

  <div class="table-card">

    <table class="activity-table">


      <thead>

        <tr>

          <th>TIPO</th>

          <th>DESCRIPCIÓN</th>

          <th>FECHA Y HORA</th>

          <th>USUARIO</th>

          <th>ID RELACIONADO</th>

        </tr>

      </thead>


      <tbody>


        <!-- ================================= -->
        <!-- FOR DE ACTIVIDADES -->
        <!-- ================================= -->

        <tr
          *ngFor="let actividad of actividadesFiltradas"
        >


          <!-- TIPO -->

          <td>

            <span
              class="badge"
              [ngClass]="'badge-' + actividad.tipo"
            >

              {{ actividad.tipo }}

            </span>

          </td>


          <!-- DESCRIPCIÓN -->

          <td>

            {{ actividad.descripcion }}

          </td>


          <!-- FECHA Y HORA -->

          <td>

            {{ actividad.fecha }}

          </td>


          <!-- USUARIO -->

          <td>

            <span class="badge-user">

              {{ actividad.user }}

            </span>

          </td>


          <!-- ID RELACIONADO -->

          <td
            [class.empty-id]="!actividad.idrelacionado"
            [class.id-code]="actividad.idrelacionado"
          >

            {{ actividad.idrelacionado || '—' }}

          </td>


        </tr>


        <!-- ================================= -->
        <!-- SI NO HAY RESULTADOS -->
        <!-- ================================= -->

        <tr
          *ngIf="actividadesFiltradas.length === 0"
        >

          <td colspan="5">

            No se encontraron actividades.

          </td>

        </tr>


      </tbody>

    </table>

  </div>

</div>
</body>
