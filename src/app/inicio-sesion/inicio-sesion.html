<p>inicio-sesion works!</p>
<div class="login-container">
  <div class="login-card">
    
    <!-- Logo -->
    <div class="logo-wrapper">
      <img src="assets/logo-biblioteca.png" alt="Biblioteca Popular Bernardino Rivadavia" class="logo" />
    </div>

    <!-- Título y Subtítulo -->
    <div class="header">
      <h1>Iniciar sesión</h1>
      <p>Ingresá tus credenciales de acceso.</p>
    </div>

    <!-- Formulario de login -->
    <form (ngSubmit)="onLogin()" class="login-form">
      
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input 
          type="text" 
          id="usuario" 
          name="usuario" 
          [(ngModel)]="usuario" 
          placeholder="admin" 
          required 
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <div class="password-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="contrasena" 
            name="contrasena" 
            [(ngModel)]="contrasena" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
          <button 
            type="button" 
            class="toggle-password-btn" 
            (click)="showPassword = !showPassword" 
            aria-label="Mostrar u ocultar contraseña"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary">
        Ingresar al sistema
      </button>

    </form>

    <!-- Pie de tarjeta -->
    <div class="footer-info">
      <span>Sistema de uso interno</span>
      <a href="#" class="brand-link">Biblioteca Popular Bernardino Rivadavia</a>
    </div>

  </div>
</div>
