<div class="modal-overlay">

  <div class="modal">

    <!-- CABECERA -->
    <div class="modal-header">

      <h2>Nuevo préstamo</h2>

      <button
        type="button"
        class="btn-cerrar"
        (click)="cerrarModal()"
      >
        ×
      </button>

    </div>


    <!-- FORMULARIO -->
    <form (ngSubmit)="crearPrestamo()">

      <!-- SOCIO -->
      <div class="form-group">

        <label for="socio">
          Socio
        </label>

        <select
          id="socio"
          name="socio"
          [(ngModel)]="idSocio"
          required
        >

          <option
            value=""
            disabled
          >
            Seleccione un socio
          </option>

          @for (socio of socios; track socio.id) {

            <option [value]="socio.id">
              {{ socio.nombre }}
            </option>

          }

        </select>

      </div>


      <!-- LIBRO -->
      <div class="form-group">

        <label for="libro">
          Libro
        </label>

        <input
          id="libro"
          type="text"
          name="libro"
          [(ngModel)]="libro"
          placeholder="Ingrese el título del libro"
          required
        >

      </div>


      <!-- INVENTARIO -->
      <div class="form-group">

        <label for="inventario">
          ID de inventario
        </label>

        <input
          id="inventario"
          type="text"
          name="inventario"
          [(ngModel)]="inventario"
          placeholder="Ej: INV007"
          required
        >

      </div>


      <!-- FECHAS -->
      <div class="form-row">

        <!-- FECHA DE INICIO -->
        <div class="form-group">

          <label for="fechaInicio">
            Fecha de inicio
          </label>

          <input
            id="fechaInicio"
            type="date"
            name="fechaInicio"
            [(ngModel)]="fechaInicio"
            disabled
          >

        </div>


        <!-- FECHA DE VENCIMIENTO -->
        <div class="form-group">

          <label for="fechaVencimiento">
            Fecha de vencimiento
          </label>

          <input
            id="fechaVencimiento"
            type="date"
            name="fechaVencimiento"
            [(ngModel)]="fechaVencimiento"
            disabled
          >

        </div>

      </div>


      <!-- BOTONES -->
      <div class="modal-actions">

        <button
          type="submit"
          class="btn-crear"
        >
          Crear préstamo
        </button>

        <button
          type="button"
          class="btn-cancelar"
          (click)="cerrarModal()"
        >
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
